<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="vs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36" />
      <stop offset="100%" stop-color="#050e1f" />
    </linearGradient>
    <linearGradient id="vs-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0153c6" />
      <stop offset="100%" stop-color="#003785" />
    </linearGradient>
    <linearGradient id="vs-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="vs-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#vs-bg)" stroke="url(#vs-primary)" stroke-width="2.5" />
  
  <!-- Subtle Grid Pattern in Background -->
  <path d="M4 44 H124 M4 84 H124 M44 4 V124 M84 4 V124" stroke="#0153c6" stroke-opacity="0.12" stroke-width="1" />

  <!-- Outer Radar Pulse Ring -->
  <circle cx="64" cy="64" r="42" stroke="url(#vs-primary)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4" />
  
  <!-- Geometric Hex Shield Core -->
  <path d="M64 24 L96 42 V78 L64 104 L32 78 V42 Z" fill="#0153c6" fill-opacity="0.16" stroke="url(#vs-primary)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Telemetry Diamond -->
  <path d="M64 38 L84 64 L64 88 L44 64 Z" fill="url(#vs-primary)" fill-opacity="0.3" stroke="url(#vs-accent)" stroke-width="2" />

  <!-- Kernel Pulse Waveform -->
  <path d="M36 64 H52 L58 48 L64 80 L70 56 L76 64 H92" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#vs-glow)" />

  <!-- Center Telemetry Beacon Point -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#vs-glow)" />
</svg>
