<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="nc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11133d" />
      <stop offset="100%" stop-color="#07081f" />
    </linearGradient>
    <linearGradient id="nc-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="nc-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="nc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#nc-bg)" stroke="url(#nc-primary)" stroke-width="2.5" />

  <!-- Cloud Fleet Hex Matrix Nodes in Background -->
  <circle cx="28" cy="40" r="2" fill="#818cf8" opacity="0.4" />
  <circle cx="100" cy="40" r="2" fill="#818cf8" opacity="0.4" />
  <circle cx="28" cy="88" r="2" fill="#818cf8" opacity="0.4" />
  <circle cx="100" cy="88" r="2" fill="#818cf8" opacity="0.4" />

  <!-- Geometric Isometric Cloud Polyhedron -->
  <!-- Top Face -->
  <polygon points="64,28 88,42 64,56 40,42" fill="url(#nc-facet)" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.5" />
  
  <!-- Left Face -->
  <polygon points="40,42 64,56 64,86 40,72" fill="#312e81" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
  
  <!-- Right Face -->
  <polygon points="64,56 88,42 88,72 64,86" fill="#4338ca" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />

  <!-- Orbiting Cloud Rings -->
  <ellipse cx="64" cy="68" rx="46" ry="18" stroke="url(#nc-primary)" stroke-width="2.5" fill="none" stroke-dasharray="12 6" transform="rotate(-15 64 68)" opacity="0.8" />

  <!-- Neural Satellite Nodes -->
  <circle cx="26" cy="62" r="4.5" fill="#38bdf8" filter="url(#nc-glow)" />
  <circle cx="102" cy="74" r="4.5" fill="#a5b4fc" filter="url(#nc-glow)" />
  <circle cx="64" cy="98" r="3.5" fill="#6366f1" />

  <!-- Central Nexus Core -->
  <circle cx="64" cy="56" r="6" fill="#ffffff" filter="url(#nc-glow)" />
</svg>
