<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="cv-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#034d75" />
    </linearGradient>
    <linearGradient id="cv-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="cv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#cv-bg)" stroke="url(#cv-metal)" stroke-width="2.5" />

  <!-- Cryptographic Binary / Circuit Rays in Background -->
  <path d="M24 24 L40 40 M104 24 L88 40 M24 104 L40 88 M104 104 L88 88" stroke="#0284c7" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" />
  
  <!-- Outer Octagonal Armored Vault Rim -->
  <polygon points="44,24 84,24 104,44 104,84 84,104 44,104 24,84 24,44" fill="#0f172a" stroke="url(#cv-metal)" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Vault Chamber Rim -->
  <circle cx="64" cy="64" r="28" stroke="url(#cv-core)" stroke-width="2.5" stroke-dasharray="8 4" fill="#090e17" />

  <!-- Heavy Vault Locking Bolts (4 pins) -->
  <rect x="61" y="28" width="6" height="8" rx="2" fill="#38bdf8" />
  <rect x="61" y="92" width="6" height="8" rx="2" fill="#38bdf8" />
  <rect x="28" y="61" width="8" height="6" rx="2" fill="#38bdf8" />
  <rect x="92" y="61" width="8" height="6" rx="2" fill="#38bdf8" />

  <!-- Central TPM Keyhole / Cyber Cipher Core -->
  <circle cx="64" cy="58" r="7" fill="url(#cv-core)" filter="url(#cv-glow)" />
  <polygon points="61,58 67,58 69,76 59,76" fill="url(#cv-core)" filter="url(#cv-glow)" />

  <!-- Center Shackle Accent -->
  <circle cx="64" cy="58" r="3" fill="#ffffff" />
</svg>
