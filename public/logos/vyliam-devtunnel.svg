<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="dt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261202" />
      <stop offset="100%" stop-color="#120800" />
    </linearGradient>
    <linearGradient id="dt-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="40%" stop-color="#ff8600" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="dt-glow-grad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="dt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#dt-bg)" stroke="url(#dt-primary)" stroke-width="2.5" />

  <!-- Speed Lines Background -->
  <line x1="16" y1="36" x2="48" y2="36" stroke="#ff8600" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" />
  <line x1="12" y1="92" x2="44" y2="92" stroke="#ff8600" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" />
  <line x1="84" y1="28" x2="114" y2="28" stroke="#ff8600" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round" />

  <!-- Tunnel Outer Portals (Concentric Iso Rings) -->
  <!-- Outer Portal Left -->
  <ellipse cx="44" cy="64" rx="22" ry="38" stroke="url(#dt-primary)" stroke-width="3" fill="none" opacity="0.4" />
  
  <!-- Center Crossing Portal -->
  <ellipse cx="64" cy="64" rx="26" ry="42" stroke="url(#dt-primary)" stroke-width="3.5" fill="none" stroke-dasharray="6 4" />

  <!-- Right Tunnel Portal -->
  <ellipse cx="84" cy="64" rx="22" ry="38" stroke="url(#dt-primary)" stroke-width="3" fill="none" opacity="0.8" />

  <!-- High-Velocity Data Core Beam -->
  <path d="M20 64 H108" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#dt-glow)" />
  
  <!-- Forward Chevron Packets -->
  <path d="M46 52 L58 64 L46 76" stroke="#fde047" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dt-glow)" />
  <path d="M68 52 L80 64 L68 76" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#dt-glow)" />

  <!-- Endpoint Packet Sparks -->
  <circle cx="20" cy="64" r="3" fill="#ff8600" />
  <circle cx="108" cy="64" r="4.5" fill="#ffffff" filter="url(#dt-glow)" />
</svg>
