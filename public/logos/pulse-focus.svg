<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="pf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0915" />
      <stop offset="100%" stop-color="#140409" />
    </linearGradient>
    <linearGradient id="pf-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="pf-wave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="pf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#pf-bg)" stroke="url(#pf-ring)" stroke-width="2.5" />

  <!-- Outer Focus Reticle -->
  <circle cx="64" cy="64" r="46" stroke="url(#pf-ring)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />
  
  <!-- Calibrated Focus Crosshairs -->
  <line x1="64" y1="14" x2="64" y2="24" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="64" y1="104" x2="64" y2="114" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="64" x2="24" y2="64" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />
  <line x1="104" y1="64" x2="114" y2="64" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" />

  <!-- Intermediate Deep Work Aura Circle -->
  <circle cx="64" cy="64" r="32" stroke="url(#pf-ring)" stroke-width="3" fill="#f43f5e" fill-opacity="0.12" />

  <!-- Dynamic Flow-State Pulse Waveform (ECG + Sine Wave) -->
  <path d="M26 64 H44 L50 74 L58 42 L66 84 L74 54 L80 64 H102" fill="none" stroke="url(#pf-wave)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#pf-glow)" />

  <!-- Flow Focus Center Star / Core -->
  <circle cx="64" cy="64" r="4.5" fill="#ffffff" filter="url(#pf-glow)" />
  <circle cx="26" cy="64" r="2.5" fill="#f43f5e" />
  <circle cx="102" cy="64" r="2.5" fill="#f43f5e" />
</svg>
